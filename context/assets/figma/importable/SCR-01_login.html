<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  body { width: 393px; height: 852px; background: #F8FAFC; color: #0F172A; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .status-bar { height: 48px; min-height: 48px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 14px; font-weight: 600; color: #0F172A; z-index: 50; }
  .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000000; border-radius: 20px; z-index: 50; }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: #0F172A; border-radius: 3px; opacity: 0.25; z-index: 50; }
  .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 82px; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: flex; justify-content: space-around; padding-top: 10px; z-index: 40; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #64748B; font-size: 11px; font-weight: 500; text-decoration: none; }
  .nav-item.active { color: #2563EB; font-weight: 600; }
  .nav-item svg { width: 22px; height: 22px; }
  .content-scroll { flex: 1; overflow-y: auto; padding: 12px 20px 24px 20px; }
  .badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .badge-success { background: #DCFCE7; color: #15803D; border: 1px solid #BBF7D0; }
  .badge-warning { background: #FEF3C7; color: #B45309; border: 1px solid #FDE68A; }
  .badge-error { background: #FEE2E2; color: #B91C1C; border: 1px solid #FECACA; }
  .badge-blue { background: #EFF6FF; color: #1D4ED8; border: 1px solid #DBEAFE; }
  .badge-slate { background: #F1F5F9; color: #475569; }
</style>
</head>
