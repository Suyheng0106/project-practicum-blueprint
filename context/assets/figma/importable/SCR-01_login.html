<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, height=852, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', 'Noto Sans Khmer', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background: #FAFAFA;
    color: #0B1220;
    margin: 0;
    padding: 0;
  }
  .card-shadow {
    box-shadow: 0 8px 24px rgba(11, 18, 32, 0.06);
  }
  .hairline {
    border: 1px solid #F0F1F3;
  }
  .border-subtle {
    border: 1px solid #E5E7EB;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 10px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 500;
  }
  .chip-neutral {
    background: #F1F5F9;
    color: #475569;
  }
  .chip-matched {
    background: #ECFDF5;
    color: #047857;
  }
  .chip-missing {
    background: #FFF1F2;
    color: #BE123C;
    border: 1px dashed #FECDD3;
  }
  .chip-selected {
    background: #F0F9FF;
    color: #0369A1;
    border: 1.5px solid #0EA5E9;
    font-weight: 600;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 10px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 600;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .status-under-review {
    background: #FFFBEB;
    color: #B45309;
  }
  .status-under-review .status-dot {
    background: #D97706;
  }
  .status-submitted {
    background: #F1F5F9;
    color: #475569;
  }
  .status-submitted .status-dot {
    background: #64748B;
  }
  .status-accepted {
    background: #ECFDF5;
    color: #047857;
  }
  .status-accepted .status-dot {
    background: #10B981;
  }
  .status-rejected {
    background: #FFF1F2;
    color: #BE123C;
  }
  .status-rejected .status-dot {
    background: #F43F5E;
  }
  .btn-ink {
    background: #0B1220;
    color: #FFFFFF;
    border: none;
    border-radius: 14px;
    height: 48px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 12px rgba(11, 18, 32, 0.12);
  }
  .btn-secondary {
    background: #FFFFFF;
    color: #0B1220;
    border: 1px solid #E5E7EB;
    border-radius: 14px;
    height: 48px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .input-filled {
    height: 52px;
    border-radius: 14px;
    background: #F5F6F8;
    border: 2px solid transparent;
    padding: 0 16px;
    font-size: 14px;
    color: #0B1220;
    width: 100%;
    outline: none;
    transition: all 0.15s ease;
  }
  .input-filled:focus {
    background: #FFFFFF;
    border-color: #0EA5E9;
    box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
  }

  html {
    overflow-y: auto;
    background: #F1F5F9;
  }
  body {
    width: 393px;
    height: 852px;
    background: #FAFAFA;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    margin: 0 auto;
  }
  .status-bar {
    height: 44px;
    min-height: 44px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    font-size: 14px;
    font-weight: 600;
    color: #0B1220;
    z-index: 40;
  }
  .dynamic-island {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #0B1220;
    border-radius: 20px;
    z-index: 45;
  }
  .content-area {
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px 24px 20px;
  }
  .home-indicator {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 4px;
    background: #0B1220;
    border-radius: 2px;
    opacity: 0.2;
    z-index: 60;
  }
</style>
</head>
<body>

    </div>
  </div>

<div style="display: flex; flex-direction: column; justify-content: center; min-height: 720px; padding: 12px 0;">

  <div style="text-align: center; margin-top: 24px; font-size: 13px; color: #4B5563;">

  </div>

  <div style="text-align: center; margin-top: 16px; font-size: 12px; color: #6B7280;">
    Are you a tech recruiter? <span style="color: #0369A1; font-weight: 500; cursor: pointer;">Use Employer Web Portal &rarr;</span>

</div>

</body>
</html>
