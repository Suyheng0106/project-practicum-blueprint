<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, height=852, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #F7F8FA;
    --surface: #FFFFFF;
    --border: #E8EAF0;
    --divider: #EEF0F4;
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #64748B;
    --accent: #4F46E5;
    --accent-hover: #4338CA;
    --accent-tint: #EEF2FF;
    --semantic-match-bg: #ECFDF5;
    --semantic-match-text: #15803D;
    --semantic-gap-bg: #FEF2F2;
    --semantic-gap-text: #B91C1C;
    --semantic-review-bg: #FFFBEB;
    --semantic-review-text: #B45309;
    --semantic-neutral-bg: #F1F5F9;
    --semantic-neutral-text: #475569;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans Khmer', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
  body { width: 393px; height: 852px; background: var(--bg-page); color: var(--text-primary); overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .status-bar { height: 48px; min-height: 48px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 14px; font-weight: 600; color: var(--text-primary); z-index: 50; }
  .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000000; border-radius: 20px; z-index: 50; }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--text-primary); border-radius: 3px; opacity: 0.2; z-index: 50; }
  .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 76px; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); border-top: 1px solid var(--divider); display: flex; justify-content: space-around; padding-top: 8px; z-index: 40; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 11px; font-weight: 500; text-decoration: none; position: relative; min-width: 54px; }
  .nav-item.active { color: var(--accent); font-weight: 600; }
  .nav-pill { width: 16px; height: 3px; background: var(--accent); border-radius: 999px; margin-top: 2px; }
  .content-scroll { flex: 1; overflow-y: auto; padding: 12px 20px 24px 20px; }

  .btn-primary-m { width: 100%; height: 44px; background: var(--accent); color: #FFFFFF; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: var(--shadow-sm); }
  .btn-secondary-m { width: 100%; height: 44px; background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: var(--shadow-sm); }
  .chip-matched { display: inline-flex; align-items: center; gap: 4px; background: var(--semantic-match-bg); color: var(--semantic-match-text); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .chip-gap { display: inline-flex; align-items: center; gap: 4px; background: var(--semantic-gap-bg); color: var(--semantic-gap-text); border: 1px dashed #FECACA; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .chip-neutral { display: inline-flex; align-items: center; background: var(--semantic-neutral-bg); color: var(--semantic-neutral-text); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; }
  .pill-accepted { background: var(--semantic-match-bg); color: var(--semantic-match-text); }
  .pill-accepted .pill-dot { background: #10B981; }
  .pill-review { background: var(--semantic-review-bg); color: var(--semantic-review-text); }
  .pill-review .pill-dot { background: #D97706; }
  .pill-submitted { background: var(--semantic-neutral-bg); color: var(--semantic-neutral-text); }
  .pill-submitted .pill-dot { background: #64748B; }
  .input-field { width: 100%; height: 46px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 14px 0 42px; font-size: 14px; color: var(--text-primary); outline: none; box-shadow: var(--shadow-sm); }
  .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
  .ui-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-sm); padding: 18px; }
</style>
</head>
<body>
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><path d="M1 9.5C1 9.5 3.5 6.5 8.5 6.5C13.5 6.5 16 9.5 16 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M3.5 7C3.5 7 5.5 4.5 8.5 4.5C11.5 4.5 13.5 7 13.5 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8.5" cy="9.5" r="1" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M23 4C23.5 4.5 24 5.2 24 6C24 6.8 23.5 7.5 23 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
  </div>
  
<div class="content-scroll" style="display: flex; flex-direction: column; justify-content: center; padding-top: 16px;">
  <div style="text-align: center; margin-bottom: 32px;">
    <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #4F46E5, #6366F1); border-radius: 14px; margin: 0 auto 16px auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.25);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
    </div>
    <h1 style="font-size: 24px; font-weight: 700; color: #0F172A; letter-spacing: -0.5px;">DevPath</h1>
    <p style="font-size: 14px; color: #64748B; margin-top: 4px; font-weight: 400;">Entry-level tech jobs matched to your skills</p>
  </div>

  <div style="display: flex; background: #EEF0F4; padding: 3px; border-radius: 10px; margin-bottom: 24px; position: relative;">
    <div style="flex: 1; text-align: center; padding: 8px 0; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #0F172A; border-radius: 8px; box-shadow: var(--shadow-sm);">Candidate</div>
    <div style="flex: 1; text-align: center; padding: 8px 0; font-size: 13px; font-weight: 500; color: #64748B;">Employer</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div>
      <label style="display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px;">Email address</label>
      <div style="position: relative;">
        <input type="text" class="input-field" value="sokha.pech@it.edu.kh">
        <span style="position: absolute; left: 14px; top: 14px; color: #64748B;"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
      </div>
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <label style="font-size: 12px; font-weight: 600; color: #475569;">Password</label>
        <span style="font-size: 12px; color: #4F46E5; font-weight: 500; cursor: pointer;">Forgot password?</span>
      </div>
      <div style="position: relative;">
        <input type="password" class="input-field" value="••••••••••••" style="padding-right: 42px;">
        <span style="position: absolute; left: 14px; top: 14px; color: #64748B;"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <span style="position: absolute; right: 14px; top: 14px; color: #64748B; cursor: pointer;"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
      </div>
    </div>

    <button class="btn-primary-m" style="margin-top: 6px;">
      Sign in
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
    </button>
  </div>

  <div style="display: flex; align-items: center; margin: 24px 0;">
    <div style="flex: 1; height: 1px; background: #EEF0F4;"></div>
    <span style="font-size: 12px; color: #94A3B8; padding: 0 14px;">or</span>
    <div style="flex: 1; height: 1px; background: #EEF0F4;"></div>
  </div>

  <button class="btn-secondary-m">
    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2Z"/></svg>
    Continue with GitHub
  </button>

  <div style="text-align: center; margin-top: 28px; font-size: 13px; color: #64748B;">
    Don't have an account? <span style="color: #4F46E5; font-weight: 600; cursor: pointer;">Create candidate account</span>
  </div>
</div>

  
  <div class="home-indicator"></div>
</body>
</html>
