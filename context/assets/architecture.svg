  <rect x="970" y="60" width="250" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="995" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#475569">External Services (Optional)</text>

  <!-- People -->
  <!-- Candidate (Sokha) -->
  <circle cx="75" cy="146" r="10" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M57,178 A18,16 0 0 1 93,178" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="75" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Candidate</text>
  <text x="75" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Sokha (Student)</text>

