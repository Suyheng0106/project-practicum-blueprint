  <text x="280" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Flutter (Dart) · iOS &amp; Android</text>
  <text x="280" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle">profile · job board · fit check · apply</text>

  <rect x="170" y="285" width="220" height="85" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
