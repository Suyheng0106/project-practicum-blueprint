  <line x1="95" y1="167" x2="162" y2="167" stroke="#475569" stroke-width="1.6"/>
  <polygon points="162,163 169,167 162,171" fill="#475569"/>

  <!-- Person 2 -> App 2 -->
  <line x1="95" y1="327" x2="162" y2="327" stroke="#475569" stroke-width="1.6"/>
  <polygon points="162,323 169,327 162,331" fill="#475569"/>

  <!-- App 1 -> Backend API -->
  <path d="M390,167 H420 V215 H442" fill="none" stroke="#475569" stroke-width="1.6"/>
  <polygon points="442,211 449,215 442,219" fill="#475569"/>

  <!-- App 2 -> Backend API -->
  <path d="M390,327 H420 V255 H442" fill="none" stroke="#475569" stroke-width="1.6"/>
  <polygon points="442,251 449,255 442,259" fill="#475569"/>

