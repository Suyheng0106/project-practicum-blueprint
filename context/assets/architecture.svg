  <path d="M750,260 V360 A85,15 0 0 0 920,360 V260" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <ellipse cx="835" cy="260" rx="85" ry="15" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="835" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">PostgreSQL 16 DB</text>
  <text x="835" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Docker Compose (:5432)</text>
  <text x="835" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle">Prisma ORM · relational schema</text>

  <!-- External Services -->
  <rect x="990" y="195" width="210" height="85" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1095" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Google Gemini API</text>
  <text x="1095" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Google AI Studio REST API</text>
  <text x="1095" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">AI Roadmap Generator (F-05)</text>

