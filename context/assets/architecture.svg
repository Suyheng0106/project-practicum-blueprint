  <text x="570" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">JWT auth · skill gap matching engine</text>

