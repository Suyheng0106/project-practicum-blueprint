  <line x1="690" y1="237" x2="982" y2="237" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4"/>
  <polygon points="982,233 989,237 982,241" fill="#64748b"/>

  <!-- Badges / Labels on Arrows -->
  <rect x="360" y="180" width="120" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">HTTP / Bearer JWT</text>

  <rect x="360" y="285" width="120" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="299" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">HTTP / Bearer JWT</text>

  <rect x="635" y="340" width="150" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="710" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Prisma / SQL (:5432)</text>

  <rect x="760" y="217" width="150" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="835" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">HTTPS / REST (API Key)</text>

  <!-- Legend -->
